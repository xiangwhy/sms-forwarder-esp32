; ============================================================================
;  PlatformIO Project Configuration File — SMS Forwarder v3.6.4
;  Board : ESP32-S3 DevKitC-1 (8MB flash, 8MB OPI PSRAM)
;  Frame : Arduino + ESP-IDF (dual framework, 因为代码 entry 用 app_main)
;  Note  : 托管组件已在 managed_components/, ESP-IDF 自动扫描 (无需改路径)
; ============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; pioarduino 社区版: Arduino-ESP32 3.x + ESP-IDF 5.5.x (USB Host 完整, RNDIS 组件 0.3.x 能拉)
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board           = esp32-s3-devkitc-1
framework       = arduino, espidf

; --- 串口 ---
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800

; --- Flash / PSRAM (保守配置: DIO + 40MHz, 无 PSRAM 也能跑; 等翔哥确认板子型号再调高) ---
board_build.flash_mode    = dio
board_build.f_flash       = 40000000L
board_build.partitions    = partitions.csv
; v4.0.7 救砖 (真相): efuse 实测 8MB flash, 用 8MB 双 OTA partitions
board_upload.flash_size   = 8MB
; 之前 4MB 配 8MB partitions → bootloader 校验越界 boot loop
; board_build.arduino.memory_type = qio_opi    ; 8MB OPI PSRAM 板; 没 PSRAM 就别开

; --- 编译参数 ---
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0          ; CDC 留给 4G 模组, Arduino USB-CDC 关掉
    ; v3.6.4: app_main 风格, 关掉 Arduino 自动 setup/loop
    -DCONFIG_AUTOSTART_ARDUINO=1
    ; ino 历史风格 (int -> gpio_num_t 等隐式转换), GCC 14 严格化后必须开
    -fpermissive
    -Wno-error=write-strings
    -Wno-error=narrowing

; --- 库依赖 (PIO Library Registry) ---
; v4.0: 换 ESP32Async 维护的 fork, 老 me-no-dev 仓库 (AsyncTCP 1.1.1, ESPAsyncWebServer 3.6.0) 不兼容 IDF 5.x
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ESP32Async/AsyncTCP @ ^3.4
    ESP32Async/ESPAsyncWebServer @ ^3.7

; --- ESP-IDF 配置 (打开 USB Host, 关 USB-Serial-JTAG, 等) ---
build_unflags =
    -Werror=all
    -Werror
board_build.embed_txtfiles =

; Arduino 框架的 sdkconfig 默认是 ESP-IDF 5.1, USB Host 已开
; 若要改 sdkconfig, 加: board_build.partitions = ... 之后跑 pio run -t menuconfig

; --- OTA 烧录环境 (WiFi IP) ---
[env:ota]
extends         = env:esp32-s3-devkitc-1
upload_protocol  = espota
upload_port      = 172.16.1.18
upload_flags     = --port=3232
